<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>التسميع</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="mushaf.css">
<style>
  body { padding-bottom: 110px; }
  #setup { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:10px 12px; background:var(--bar); color:var(--barink); }
  #setup select, #setup input { padding:4px 6px; border-radius:6px; border:0; }
  #text { max-width:640px; margin:16px auto; padding:0 16px; font-size:28px; line-height:2.3; text-align:justify; }
  .mw { display:inline-block; margin:0 .18em; position:relative; transition:filter .25s; }
  .mw.hid { filter:blur(7px); cursor:pointer; user-select:none; }
  .mw.near { border-bottom:2px dotted var(--gold); }
  .mw.err { color:#c0392b; }                 /* blurred AND tinted: the word is not revealed until said correctly */
  .mw small { position:absolute; top:-.9em; right:0; font:11px sans-serif; white-space:nowrap; color:#c0392b; }
  .num { color:var(--gold); font-size:.7em; margin:0 .3em; }
  #dock { position:fixed; bottom:0; left:0; right:0; display:flex; align-items:center; gap:14px; padding:10px 16px; background:var(--bar); color:var(--barink);
          padding-bottom:max(10px, env(safe-area-inset-bottom)); }
  #mic { width:56px; height:56px; border-radius:50%; border:0; font-size:24px; background:var(--gold); color:#222; }
  #mic.on { background:#c0392b; color:#fff; animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 10px rgba(192,57,43,.25); } }
  #fix { flex:1; min-width:0; }
  #state { font-size:14px; }
  #corr { max-height:3.9em; overflow-y:auto; font-size:12px; line-height:1.6; opacity:.95; margin-top:2px; }
  #corr b { color:#ffb4a8; }
  #heard { font-size:11px; opacity:.65; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
</style>
</head>
<body>
<nav id="tabs"><a href="index.html">المصحف</a><a href="tafsir.html">تفسير</a><a class="on" href="memorize.html">تسميع</a></nav>
<div id="setup">
  <select id="surah"></select>
  من <input id="from" type="number" min="1" value="1" style="width:4.5em"> إلى <input id="to" type="number" min="1" value="3" style="width:4.5em">
  <button id="start">ابدأ</button> <small id="ver" style="opacity:.6"></small>
</div>
<main id="text"></main>
<div id="dock"><button id="mic" aria-label="ميكروفون">🎤</button><div id="fix"><div id="state">اضغط «ابدأ» ثم الميكروفون واقرأ من حفظك. الكلمة المضببة لم تُقرأ بعد.</div><div id="corr"></div><div id="heard"></div></div></div>
<script src="config.js"></script>
<script src="memorize-core.js"></script>
<script src="memorize.js"></script>
</body>
</html>
